basePath: /api/v1
definitions:
  domain.City:
    properties:
      id:
        type: integer
      label:
        type: string
      name:
        type: string
    type: object
  domain.CuisineType:
    properties:
      id:
        type: integer
      label:
        type: string
      name:
        type: string
    type: object
  domain.DayHours:
    properties:
      close:
        type: string
      open:
        type: string
    type: object
  domain.DevicePlatform:
    enum:
    - ios
    - android
    type: string
    x-enum-varnames:
    - DevicePlatformIOS
    - DevicePlatformAndroid
  domain.DietaryTag:
    enum:
    - halal
    - vegetarian
    - vegan
    - gluten_free
    - kosher
    type: string
    x-enum-varnames:
    - DietaryTagHalal
    - DietaryTagVegetarian
    - DietaryTagVegan
    - DietaryTagGlutenFree
    - DietaryTagKosher
  domain.Language:
    enum:
    - en
    - kk
    - en
    - ru
    - uk
    - zh
    type: string
    x-enum-varnames:
    - LanguageDefault
    - LanguageKazakh
    - LanguageEnglish
    - LanguageRussian
    - LanguageUkrainian
    - LanguageChinese
  domain.NotificationSettings:
    properties:
      order_updates:
        type: boolean
      promotions:
        type: boolean
    type: object
  domain.Order:
    properties:
      created_at:
        type: string
      display_number:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      payment_id:
        type: string
      pickup_code:
        type: string
      pickup_window_end:
        type: string
      pickup_window_start:
        type: string
      restaurant_id:
        type: string
      reviewed_at:
        type: string
      status:
        $ref: '#/definitions/domain.OrderStatus'
      total_amount:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  domain.OrderItem:
    properties:
      id:
        type: string
      order_id:
        type: string
      price:
        type: number
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
    type: object
  domain.OrderReason:
    enum:
    - out_of_stock
    - payment_timeout
    - internal_system_error
    - failed_audit
    - payment_failed
    type: string
    x-enum-varnames:
    - OrderReasonOutOfStock
    - OrderReasonTimeout
    - OrderReasonInternalSystemError
    - OrderReasonFailedAudit
    - OrderReasonPaymentFailed
  domain.OrderStatus:
    enum:
    - PENDING
    - PAID
    - ACCEPTED
    - READY
    - COLLECTED
    - CANCELLED
    - UNPAID
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusPaid
    - OrderStatusAccepted
    - OrderStatusReady
    - OrderStatusCollected
    - OrderStatusCancelled
    - OrderStatusUnpaid
  domain.OrderStatusHistoryEntry:
    properties:
      actor_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      new_status:
        $ref: '#/definitions/domain.OrderStatus'
      old_status:
        $ref: '#/definitions/domain.OrderStatus'
      order_id:
        type: string
      reason:
        $ref: '#/definitions/domain.OrderReason'
    type: object
  domain.Product:
    properties:
      category:
        $ref: '#/definitions/domain.ProductCategory'
      category_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      discounted_price:
        type: number
      id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      original_price:
        type: number
      pickup_time_end:
        type: string
      pickup_time_start:
        type: string
      quantity_available:
        type: integer
      restaurant_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.ProductCategory:
    properties:
      id:
        type: integer
      label:
        type: string
      name:
        type: string
    type: object
  domain.Restaurant:
    properties:
      address:
        type: string
      city:
        $ref: '#/definitions/domain.City'
      city_id:
        type: integer
      created_at:
        type: string
      cuisine_types:
        items:
          $ref: '#/definitions/domain.CuisineType'
        type: array
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      phone:
        type: string
      rating_avg:
        type: number
      rating_count:
        type: integer
      role:
        $ref: '#/definitions/domain.StaffRole'
      social_links:
        $ref: '#/definitions/domain.SocialLinks'
      updated_at:
        type: string
      website:
        type: string
      working_hours:
        $ref: '#/definitions/domain.WorkingHours'
    type: object
  domain.RestaurantStaff:
    properties:
      created_at:
        type: string
      id:
        type: string
      restaurant_id:
        type: string
      role:
        $ref: '#/definitions/domain.StaffRole'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  domain.Review:
    properties:
      author_avatar_url:
        type: string
      author_name:
        type: string
      comment:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_hidden:
        type: boolean
      order_id:
        type: string
      photo_urls:
        items:
          type: string
        type: array
      rating:
        type: integer
      replied_at:
        type: string
      reply:
        type: string
      restaurant_id:
        type: string
      restaurant_name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  domain.ReviewPhoto:
    properties:
      author_avatar_url:
        type: string
      author_name:
        type: string
      comment:
        type: string
      created_at:
        type: string
      rating:
        type: integer
      replied_at:
        type: string
      reply:
        type: string
      review_id:
        type: string
      url:
        type: string
    type: object
  domain.SocialLinks:
    properties:
      instagram:
        type: string
      telegram:
        type: string
    type: object
  domain.StaffRole:
    enum:
    - manager
    - owner
    type: string
    x-enum-varnames:
    - StaffRoleManager
    - StaffRoleOwner
  domain.TokenPair:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  domain.User:
    properties:
      avatar_url:
        type: string
      city_id:
        type: integer
      created_at:
        type: string
      dietary_preferences:
        items:
          $ref: '#/definitions/domain.DietaryTag'
        type: array
      email:
        type: string
      id:
        type: string
      language:
        $ref: '#/definitions/domain.Language'
      name:
        type: string
      notification_settings:
        $ref: '#/definitions/domain.NotificationSettings'
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
      updated_at:
        type: string
    type: object
  domain.UserRole:
    enum:
    - customer
    - partner
    - admin
    type: string
    x-enum-varnames:
    - UserRoleCustomer
    - UserRolePartner
    - UserRoleAdmin
  domain.WorkingHours:
    properties:
      fri:
        $ref: '#/definitions/domain.DayHours'
      mon:
        $ref: '#/definitions/domain.DayHours'
      sat:
        $ref: '#/definitions/domain.DayHours'
      sun:
        $ref: '#/definitions/domain.DayHours'
      thu:
        $ref: '#/definitions/domain.DayHours'
      tue:
        $ref: '#/definitions/domain.DayHours'
      wed:
        $ref: '#/definitions/domain.DayHours'
    type: object
  http.AddReplyRequest:
    properties:
      reply:
        maxLength: 1000
        minLength: 1
        type: string
    required:
    - reply
    type: object
  http.AddStaffRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/domain.StaffRole'
        enum:
        - manager
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  http.AssignOwnerRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  http.AuthResponse:
    properties:
      status:
        example: success
        type: string
      tokens:
        $ref: '#/definitions/domain.TokenPair'
      user:
        $ref: '#/definitions/domain.User'
    type: object
  http.CancelByRestaurantRequest:
    properties:
      reason:
        allOf:
        - $ref: '#/definitions/domain.OrderReason'
        maxLength: 500
        minLength: 10
    required:
    - reason
    type: object
  http.CancelByUserRequest:
    properties:
      reason:
        allOf:
        - $ref: '#/definitions/domain.OrderReason'
        maxLength: 500
        minLength: 10
    type: object
  http.CitiesResponse:
    properties:
      cities:
        items:
          $ref: '#/definitions/domain.City'
        type: array
    type: object
  http.CityResponse:
    properties:
      city:
        $ref: '#/definitions/domain.City'
    type: object
  http.CompleteGoogleLoginRequest:
    properties:
      code:
        type: string
      phone:
        type: string
      session_id:
        type: string
    required:
    - code
    - phone
    - session_id
    type: object
  http.CreateCityRequest:
    properties:
      label:
        maxLength: 50
        minLength: 2
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - label
    - name
    type: object
  http.CreateCuisineTypeRequest:
    properties:
      label:
        maxLength: 50
        minLength: 2
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - label
    - name
    type: object
  http.CreateOrderItemDTO:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  http.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/http.CreateOrderItemDTO'
        minItems: 1
        type: array
      pickup_window_end:
        type: string
      pickup_window_start:
        type: string
      restaurant_id:
        type: string
    required:
    - items
    - pickup_window_end
    - pickup_window_start
    - restaurant_id
    type: object
  http.CreateOrderResponse:
    properties:
      client_secret:
        type: string
      order:
        $ref: '#/definitions/domain.Order'
    type: object
  http.CreateProductCategoryRequest:
    properties:
      label:
        maxLength: 50
        minLength: 2
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - label
    - name
    type: object
  http.CreateProductRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      discounted_price:
        type: number
      image_url:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      original_price:
        type: number
      pickup_time_end:
        type: string
      pickup_time_start:
        type: string
      quantity_available:
        minimum: 0
        type: integer
    required:
    - discounted_price
    - name
    - original_price
    - pickup_time_end
    - pickup_time_start
    - quantity_available
    type: object
  http.CreateRestaurantRequest:
    properties:
      address:
        type: string
      city_id:
        type: integer
      description:
        type: string
      image_url:
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      name:
        minLength: 2
        type: string
      owner_id:
        type: string
      phone:
        type: string
      social_links:
        $ref: '#/definitions/domain.SocialLinks'
      website:
        type: string
      working_hours:
        $ref: '#/definitions/domain.WorkingHours'
    required:
    - name
    - owner_id
    type: object
  http.CreateReviewRequest:
    properties:
      comment:
        maxLength: 1000
        minLength: 1
        type: string
      photo_urls:
        items:
          type: string
        maxItems: 5
        type: array
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - rating
    type: object
  http.CuisineTypeResponse:
    properties:
      cuisine_type:
        $ref: '#/definitions/domain.CuisineType'
    type: object
  http.CuisineTypesResponse:
    properties:
      cuisine_types:
        items:
          $ref: '#/definitions/domain.CuisineType'
        type: array
    type: object
  http.DeleteDeviceTokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  http.DeleteRequest:
    properties:
      file_url:
        type: string
    required:
    - file_url
    type: object
  http.EmailSendOTPRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  http.GoogleLoginRequest:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  http.LinkGoogleRequest:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  http.MarkAsCollectedRequest:
    properties:
      force:
        description: flag for skipping pickup code validation
        type: boolean
      pickup_code:
        type: string
    type: object
  http.OAuthNeedPhoneResponse:
    properties:
      session_id:
        example: u-u-i-d
        type: string
      status:
        example: need_phone
        type: string
    type: object
  http.OrderResponse:
    properties:
      order:
        $ref: '#/definitions/domain.Order'
    type: object
  http.OrdersResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/domain.Order'
        type: array
    type: object
  http.PhoneLoginRequest:
    properties:
      code:
        type: string
      phone:
        type: string
    required:
    - code
    - phone
    type: object
  http.PhoneSendOTPRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  http.PresignRequest:
    properties:
      content_type:
        enum:
        - image/jpeg
        - image/png
        - image/webp
        type: string
      target:
        description: folder name
        enum:
        - avatar
        - restaurant_logo
        - restaurant_banner
        - product
        - category
        - review
        type: string
    required:
    - content_type
    - target
    type: object
  http.PresignResponse:
    properties:
      file_url:
        type: string
      upload_url:
        type: string
    type: object
  http.ProductCategoriesResponse:
    properties:
      product_categories:
        items:
          $ref: '#/definitions/domain.ProductCategory'
        type: array
    type: object
  http.ProductCategoryResponse:
    properties:
      product_category:
        $ref: '#/definitions/domain.ProductCategory'
    type: object
  http.ProductResponse:
    properties:
      product:
        $ref: '#/definitions/domain.Product'
    type: object
  http.ProductsResponse:
    properties:
      products:
        items:
          $ref: '#/definitions/domain.Product'
        type: array
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  http.RefreshResponse:
    properties:
      tokens:
        $ref: '#/definitions/domain.TokenPair'
    type: object
  http.RegisterDeviceTokenRequest:
    properties:
      platform:
        allOf:
        - $ref: '#/definitions/domain.DevicePlatform'
        enum:
        - ios
        - android
      token:
        type: string
    required:
    - platform
    - token
    type: object
  http.RestaurantResponse:
    properties:
      restaurant:
        $ref: '#/definitions/domain.Restaurant'
    type: object
  http.RestaurantsResponse:
    properties:
      restaurants:
        items:
          $ref: '#/definitions/domain.Restaurant'
        type: array
    type: object
  http.ReviewPhotosResponse:
    properties:
      photos:
        items:
          $ref: '#/definitions/domain.ReviewPhoto'
        type: array
    type: object
  http.ReviewResponse:
    properties:
      review:
        $ref: '#/definitions/domain.Review'
    type: object
  http.ReviewsResponse:
    properties:
      reviews:
        items:
          $ref: '#/definitions/domain.Review'
        type: array
    type: object
  http.StaffResponse:
    properties:
      staff:
        items:
          $ref: '#/definitions/domain.RestaurantStaff'
        type: array
    type: object
  http.StatusHistoryResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/domain.OrderStatusHistoryEntry'
        type: array
    type: object
  http.UpdateCuisinesRequest:
    properties:
      cuisine_ids:
        items:
          type: integer
        type: array
    required:
    - cuisine_ids
    type: object
  http.UpdateEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  http.UpdatePhoneRequest:
    properties:
      code:
        type: string
      phone:
        type: string
    required:
    - code
    - phone
    type: object
  http.UpdateProductRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      discounted_price:
        type: number
      image_url:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      original_price:
        type: number
      pickup_time_end:
        type: string
      pickup_time_start:
        type: string
    type: object
  http.UpdateRestaurantRequest:
    properties:
      address:
        type: string
      city_id:
        type: integer
      description:
        type: string
      image_url:
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      name:
        minLength: 2
        type: string
      phone:
        type: string
      social_links:
        $ref: '#/definitions/domain.SocialLinks'
      website:
        type: string
      working_hours:
        $ref: '#/definitions/domain.WorkingHours'
    type: object
  http.UpdateStaffRoleRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/domain.StaffRole'
        enum:
        - manager
    required:
    - role
    type: object
  http.UpdateStatusRequest:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  http.UpdateStockRequest:
    properties:
      quantity:
        minimum: 0
        type: integer
    required:
    - quantity
    type: object
  http.UpdateUserRequest:
    properties:
      avatar_url:
        type: string
      city_id:
        type: integer
      dietary_preferences:
        items:
          $ref: '#/definitions/domain.DietaryTag'
        type: array
      language:
        allOf:
        - $ref: '#/definitions/domain.Language'
        enum:
        - kk
        - en
        - ru
        - uk
        - zh
      name:
        type: string
      notification_settings:
        $ref: '#/definitions/domain.NotificationSettings'
    type: object
  http.UserResponse:
    properties:
      user:
        $ref: '#/definitions/domain.User'
    type: object
  respond.ErrorResponse:
    properties:
      code:
        description: code for frontend
        type: string
      details:
        additionalProperties:
          type: string
        description: for validation errors
        type: object
      message:
        description: text for logs/debug
        type: string
    type: object
  respond.MessageResponse:
    properties:
      message:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for the 2food backend service.
  title: 2food API
  version: "1.0"
paths:
  /admin/catalog/cities:
    post:
      consumes:
      - application/json
      description: Creates a new city and assigns the specified user as the owner.
        Caller must be an admin.
      parameters:
      - description: City data and owner ID
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/http.CreateCityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created city
          schema:
            $ref: '#/definitions/http.CityResponse'
        "400":
          description: Validation error or invalid JSON
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "403":
          description: Permission denied
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new city
      tags:
      - catalog
  /admin/catalog/cities/{city_id}:
    delete:
      description: Deletes a city from the system. Caller must be an admin.
      parameters:
      - description: City ID
        in: path
        name: city_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content - City successfully deleted
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "403":
          description: Permission denied
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: City not found
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete a city
      tags:
      - catalog
  /admin/catalog/cuisine-types:
    post:
      consumes:
      - application/json
      description: Creates a new cuisine type and assigns the specified user as the
        owner. Caller must be an admin.
      parameters:
      - description: Cuisine type data and owner ID
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/http.CreateCuisineTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created cuisine type
          schema:
            $ref: '#/definitions/http.CuisineTypeResponse'
        "400":
          description: Validation error or invalid JSON
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "403":
          description: Permission denied
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new cuisine type
      tags:
      - catalog
  /admin/catalog/cuisine-types/{cuisine_type_id}:
    delete:
      description: Deletes a cuisine type from the system. Caller must be an admin.
      parameters:
      - description: Cuisine type ID
        in: path
        name: cuisine_type_id
        required: true
        type: integer
